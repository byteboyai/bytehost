<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bilingual Live</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      h1 { margin-bottom: 0.25rem; }
      #hint { color: #555; margin-top: 0; }
      /* 输入框与滚动区用于证明语言热切换不丢状态:render() 只更新文本,
         绝不读写下面的 input 值或滚动位置,所以切换语言后用户已输入的内容与
         滚动位置都保留(无 reload / 不重建外层 DOM)。 */
      #note {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        margin: 1rem 0;
        box-sizing: border-box;
      }
      #log {
        height: 8rem;
        overflow: auto;
        border: 1px solid #ccc;
        padding: 0.5rem;
        font-size: 0.8rem;
        line-height: 1.4;
        color: #666;
      }
      #meta { color: #888; font-size: 0.8rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1 id="greeting">…</h1>
    <p id="hint"></p>

    <input id="note" type="text" placeholder="type here — it survives a language switch" />
    <div id="log"></div>

    <p id="meta"></p>

    <script src="app.js"></script>
  </body>
</html>
