<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legacy Sample</title>
  </head>
  <body>
    <h1>Legacy Sample</h1>
    <p>
      This app predates the i18n contract: it declares no
      <code>[i18n]</code> section, only <code>name</code> and
      <code>Entrypoint.title</code>. The host shows its stable original name
      and never installs the language bridge.
    </p>
  </body>
</html>
