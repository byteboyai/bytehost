name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 默认 feature 构建:apps 的 server/digest/manifest-toml 分层靠 feature 表达,
  # `--all-features` 通过不代表默认构建能编过(缺少默认 feature 的 cfg 分支只有这里会暴露)。
  default-features:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --no-default-features
        run: cargo check --workspace --no-default-features

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: 依赖门禁(去产品 / 去界面框架 / 去平台 webview 库)
        run: bash scripts/check-deps.sh

      - name: 依赖门禁变异测试(注入产品依赖/界面框架必须失败)
        run: bash scripts/check-deps.sh --self-test
