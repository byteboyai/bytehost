name: Joint build

# bytehost 发版/手动触发时,用当前工作树构建消费方(bytehost 优化 Tier5 Task4)。
#
# 做法:把 dozer checkout 成 bytehost 的 sibling,再由 `scripts/joint-build.sh`
# 用 `cargo --config` 把 9 个 bytehost crate 临时 patch 到本次 checkout 的
# bytehost 工作树,跑 `cargo check -p dozer-app`。这样"bytehost 的改动会破坏
# 消费方"在打 tag 时就能发现,不必等人工同日升级。
#
# 注意:digger **没有 GitHub 远端**(本地仓库),暂时无法纳入;它有远端后
# 在下面加一个 checkout + `scripts/joint-build.sh digger` 即可。
#
# 该 job 只在 tag 与手动触发时跑:PR/日常 push 由各仓库自己的 CI 负责。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  joint-build:
    runs-on: macos-latest
    steps:
      - name: Checkout bytehost
        uses: actions/checkout@v4
        with:
          path: bytehost

      - name: Checkout dozer
        uses: actions/checkout@v4
        with:
          repository: byteboyai/dozer
          path: dozer

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dozer/target
          key: ${{ runner.os }}-joint-${{ hashFiles('dozer/Cargo.lock') }}

      - name: 用当前 bytehost 构建 dozer
        env:
          CONSUMERS_ROOT: ${{ github.workspace }}
        run: bytehost/scripts/joint-build.sh dozer
