[package]
name = "desktop-contract-spike"
version = "0.0.0"
edition = "2024"
publish = false

# 一次性验证(Task 02 §11 闸门 1):无业务模型的 iced 窗口 + wry 子视图,
# 同一 Host 泛型接口接受两个不同产品消息类型,同一 Surface 描述表达两类推送形状。
# 独立 [workspace]:bytehost 依赖门禁禁止工作区内出现 iced/wry,故放工作区外。随时可删。

[workspace]

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
wry = "0.55.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
