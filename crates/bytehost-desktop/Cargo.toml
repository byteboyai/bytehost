[package]
name = "bytehost-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "bytehost 共享桌面宿主:iced 窗口壳 + wry 子视图执行 + 产品泛型回调。允许 iced/wry,不含任何产品业务 crate。"

[dependencies]
bytehost-core.workspace = true
# 应用 webview 的纯安全策略(origin 导航白名单、存储标识、IPC nonce/注入脚本):
# 规格 §6.4 要求 builder 只在 desktop 层有一份,产品不复制 wry 初始化代码。
bytehost-webview = { path = "../bytehost-webview" }
serde.workspace = true
serde_json.workspace = true
# 只消费 iced 的核心契约(Element/Task/window/widget/futures),不打开任何
# 渲染器后端默认 feature——否则会把 tiny-skia fallback renderer 强制并进
# 消费方(如 dozer-app)的 iced 依赖树,改变其 iced_renderer 类型。
iced = { version = "0.14", default-features = false, features = ["tokio"] }
wry = "0.55.1"
# 取 macOS 主版本号判数据存储清除是否受支持(纯策略 crate 不碰 objc2,宿主层来问)。
objc2-foundation = "0.3"
tokio.workspace = true
# 独立原生浮层建窗(C10):只搬"不碰渲染器后端"的建窗/定位胶水——需要 winit 的
# 窗口句柄/事件循环类型,以及 macOS 上 `setAcceptsMouseMovedEvents:` 的 objc2 调用。
# 刻意不引入 iced_wgpu/iced_winit/iced_renderer(见 R2 修复,保持不绑渲染器 feature)。
winit = "0.30"
raw-window-handle = "0.6"
objc2-app-kit = "0.3"

# C10 方案 C:把 `OverlayGpu`(wgpu 渲染管线)+ `backdrop_card*`(遮罩外壳)也上收宿主,
# 使产品侧浮层文件不再自写"建窗/透明/穿透/alpha 模式"机制(`R-OVERLAY-DUP` 归零)。
# **默认 feature 关**:不开 `overlay` 的消费方(digger、测试、desktop 自身默认构建)
# 依赖树**不变**,不触发 R2 红线(不把 tiny-skia fallback renderer 并进消费方)。
# 开启 `overlay` 的消费方(dozer-app)本来已依赖这些 crate,且必须与本模块使用
# **同一份** iced/iced_wgpu/iced_winit/iced_renderer(同一 feature 集),否则
# `Renderer` 类型不匹配——现状三者都以同一 git tag 锁 iced 0.14,可满足。
iced_wgpu = { version = "0.14", optional = true, default-features = true }
iced_winit = { version = "0.14", optional = true }
iced_widget = { version = "0.14", optional = true, features = ["wgpu", "canvas", "svg", "markdown", "highlighter", "image"] }
iced_renderer = { version = "0.14", optional = true }

[features]
default = []
overlay = [
    "dep:iced_wgpu",
    "dep:iced_winit",
    "dep:iced_widget",
    "dep:iced_renderer",
]

[dev-dependencies]

[[example]]
name = "minimal"
path = "examples/minimal.rs"
