[package]
name = "bytehost-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "bytehost 共享桌面宿主:iced 窗口壳 + wry 子视图执行 + 产品泛型回调。允许 iced/wry,不含任何产品业务 crate。"

[dependencies]
bytehost-core.workspace = true
# 应用 webview 的纯安全策略(origin 导航白名单、存储标识、IPC nonce/注入脚本):
# 规格 §6.4 要求 builder 只在 desktop 层有一份,产品不复制 wry 初始化代码。
bytehost-webview = { path = "../bytehost-webview" }
serde_json.workspace = true
# 只消费 iced 的核心契约(Element/Task/window/widget/futures),不打开任何
# 渲染器后端默认 feature——否则会把 tiny-skia fallback renderer 强制并进
# 消费方(如 dozer-app)的 iced 依赖树,改变其 iced_renderer 类型。
iced = { version = "0.14", default-features = false, features = ["tokio"] }
wry = "0.55.1"
# 取 macOS 主版本号判数据存储清除是否受支持(纯策略 crate 不碰 objc2,宿主层来问)。
objc2-foundation = "0.3"
tokio.workspace = true

[dev-dependencies]

[[example]]
name = "minimal"
path = "examples/minimal.rs"
